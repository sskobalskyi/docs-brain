name: docs-brain

# `docker compose up --build` starts everything: web UI on http://localhost:8090, API on http://localhost:5090.
# The first start pulls two Ollama models (about 2.5 GB). For an offline run without models use:
#   COMPOSE_PROFILES= AI_PROVIDER=mock docker compose up --build
# For development run only the database (`docker compose up -d postgres`) and start the API and web app from source.

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: docsbrain
      POSTGRES_PASSWORD: docsbrain
      POSTGRES_DB: docsbrain
    ports:
      - "5434:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsbrain -d docsbrain"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.7
    profiles: [llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.5.7
    profiles: [llm]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2:3b"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/DocsBrain.Api/Dockerfile
    environment:
      # Development mode enables the demo sign-in (/dev/token) and schema creation.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=docsbrain;Username=docsbrain;Password=docsbrain
      Ai__Provider: ${AI_PROVIDER:-ollama}
      Ai__OllamaUrl: http://ollama:11434
      # The hashing mock embeddings have a different similarity scale than real models.
      Search__MinSimilarity: ${SEARCH_MIN_SIMILARITY:-0.5}
      Seed__Enabled: "true"
      # Optional: accept service tokens of an external OpenID Connect authority (see ADR 7).
      Auth__Authority: ${AUTH_AUTHORITY:-}
      Auth__Issuer: ${AUTH_ISSUER:-}
    ports:
      - "5090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: web
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-data:
