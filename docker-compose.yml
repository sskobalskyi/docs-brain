name: docs-brain

# `docker compose up -d postgres` starts the database; run the API from source for development.
# Local models: `docker compose --profile llm up -d` starts Ollama and pulls the embedding model.
# Without Ollama set `Ai__Provider=mock` (offline hashing embeddings) or let ingestion fall back to keyword search.

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: docsbrain
      POSTGRES_PASSWORD: docsbrain
      POSTGRES_DB: docsbrain
    ports:
      - "5434:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsbrain -d docsbrain"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.7
    profiles: [llm]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.5.7
    profiles: [llm]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"

volumes:
  postgres-data:
  ollama-data:
