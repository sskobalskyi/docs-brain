server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # The browser only talks to this origin; the API is reached through the proxy.
    location ~ ^/(api|dev)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Server-sent events must not be buffered, or the answer arrives in one piece.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
